  <!-- Rays -->
  <g stroke="#f4c95f" stroke-width="1.7" stroke-linecap="round">
    <path d="M16 4.8v2.6"/>
    <path d="M16 24.6v2.6"/>
    <path d="M4.8 16h2.6"/>
    <path d="M24.6 16h2.6"/>
    <path d="M8.1 8.1l1.85 1.85"/>
    <path d="M22.05 22.05l1.85 1.85"/>
    <path d="M22.05 9.95l1.85-1.85"/>
    <path d="M8.1 23.9l1.85-1.85"/>
  </g>

